name: Deploy on LocalStack

on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  cdk:
    name: Deploy the CDK stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install lstk and the CDK CLI
        run: |
          make install
          lstk setup aws --force --non-interactive

      - name: Run the unit tests
        run: |
          npm ci
          npm test

      - name: Start LocalStack
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
          # The function is arm64 and the runner is x86_64
          LOCALSTACK_LAMBDA_IGNORE_ARCHITECTURE: 1
        run: make start

      - name: Deploy the CDK stack
        run: make deploy

      - name: Run tests
        run: make test

      - name: Show LocalStack logs
        if: failure()
        run: lstk logs | tail -300
